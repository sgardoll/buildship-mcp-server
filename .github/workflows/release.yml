name: Prepare draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable package version to release (for example, 0.3.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        run: node scripts/check-release.mjs "$RELEASE_VERSION"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  release:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Refuse existing tags or releases
        run: node scripts/check-release.mjs "$RELEASE_VERSION" --remote

      - name: Create draft at the verified commit
        run: gh release create "v$RELEASE_VERSION" --target "$GITHUB_SHA" --draft --generate-notes
